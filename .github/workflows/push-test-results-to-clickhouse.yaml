name: push-test-results-to-clickhouse

# Ingests JUnit XML from hf-adapters' model-centric e2e suites into ClickHouse by CALLING
# torch-spyre's push-to-clickhouse.yaml, rather than running a forked copy of its ingest.
#
# This restores what hf-adapters#276 established -- "reusing torch-spyre's canonical
# ingest_xml.py via cross-repo checkout rather than forking a copy" -- which #317 replaced
# with .github/scripts/ingest_xml_hf_adapters.py the same day. The fork then diverged: it
# never gained --schema, the v2 database, or the shared identity helpers, and it mints uuid4
# case ids that cannot reconcile across runs. Calling the workflow, not checking out its
# script, keeps the ingest's own plumbing (uv, deps, the library version it was tested with)
# on the side that owns it.
#
# Triggered by both workflows that produce those suites:
#   - test_pull_request.yaml (hf-adapters' PR/trunk workflow)
#   - integration-tests.yaml (delegates to _test_matrix.yaml, which runs the same suites --
#     smoke, load, token_compare, embed_compare, vlm, model_module -- against
#     upstream-triggered or manually dispatched refs)
#
# NOTE: this filename is deliberately NOT push-to-clickhouse.yaml -- that name is already
# taken by this repo's unrelated HF-Hub weekly-model-scan cron job, which references the same
# CLICKHOUSE_* secrets for its own purposes.
on:
  workflow_run:
    workflows:
      - integration-tests
      - test_pull_request
    types: [completed]
  workflow_dispatch:
    inputs:
      gha_run_id:
        description: GHA run ID to re-ingest (leave blank to skip)
        required: false
        default: ''
      workflow_name:
        description: Workflow name (integration-tests | test_pull_request)
        required: false
        default: integration-tests
      clickhouse_env:
        description: ClickHouse instance for a manual re-ingest — prod (default) or dev.
        required: false
        default: prod

concurrency:
  # Allow at most one ingest per triggering run (re-runs queue behind)
  group: ingest-${{ github.event.workflow_run.id || inputs.gha_run_id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # needed to download artifacts from the triggering run

jobs:
  ingest:
    # Skip a cancelled trigger; an ingest failure is not fatal to anything.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion != 'cancelled'
    uses: torch-spyre/torch-spyre/.github/workflows/push-to-clickhouse.yaml@main
    with:
      gha_run_id: ${{ github.event.workflow_run.id || inputs.gha_run_id }}
      workflow_name: ${{ github.event.workflow_run.name || inputs.workflow_name }}
      # The suite's real owner. component is a test_case_id hash input, so leaving it at the
      # callee's default would re-key every row under 'torch-spyre' rather than merely
      # mislabel it -- one suite would reconcile to two identities depending on the caller.
      component: hf-adapters
      # The artifacts and the PR live here, not in the repo hosting the called workflow.
      repository: ${{ github.repository }}
      branch: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      triggered_at: ${{ github.event.workflow_run.created_at || '' }}
      # run-name carries "integration-tests (<tier>)" for integration-tests, and the bare
      # tier for test_pull_request; the callee parses both, so the tier survives without a
      # second API call.
      display_title: ${{ github.event.workflow_run.display_title || '' }}
      triggering_event: ${{ github.event.workflow_run.event || '' }}
      clickhouse_env: ${{ inputs.clickhouse_env || 'prod' }}
    # inherit, not a per-name list: the callee declares an exhaustive secrets block covering
    # both the prod and the _DEV ClickHouse sets, and CLICKHOUSE_DB_V2 is what makes the v2
    # write anything but a no-op. Naming them here would be a second list to keep in step.
    secrets: inherit
